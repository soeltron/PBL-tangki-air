services:
  mqtt:
    image: tandon-mqtt:latest
    build:
      context: .
      dockerfile: docker/mosquitto/Dockerfile
    entrypoint: ["/bin/sh", "/docker/entrypoint.sh"]
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in .env.docker}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env.docker}
      TZ: Asia/Jakarta
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - mqtt_data:/mosquitto/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -t '$$SYS/broker/uptime' -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -C 1 -W 5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: tandon
      MARIADB_USER: ${DB_USERNAME:-tandon}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env.docker}
      TZ: Asia/Jakarta
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    environment:
      DB_HOST: db
      DB_DATABASE: tandon
      DB_USERNAME: ${DB_USERNAME:-tandon}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      TZ: Asia/Jakarta
    volumes:
      - backups:/backups
      - ./docker/backup.sh:/usr/local/bin/backup.sh:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  app:
    image: tandon-app:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Jakarta
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: tandon
      DB_USERNAME: ${DB_USERNAME:-tandon}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in .env.docker}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env.docker}
      TZ: Asia/Jakarta
    volumes:
      - laravel_storage:/var/www/storage
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./backend/public:/var/www/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    image: tandon-app:latest
    command: ["php", "artisan", "mqtt:listen"]
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Jakarta
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: tandon
      DB_USERNAME: ${DB_USERNAME:-tandon}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in .env.docker}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env.docker}
      TZ: Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  scheduler:
    image: tandon-app:latest
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env.docker
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_TIMEZONE: Asia/Jakarta
      DB_CONNECTION: mariadb
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: tandon
      DB_USERNAME: ${DB_USERNAME:-tandon}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.docker}
      MQTT_HOST: mqtt
      MQTT_PORT: "1883"
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in .env.docker}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env.docker}
      TZ: Asia/Jakarta
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "web:80"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    profiles:
      - tunnel
    depends_on:
      - web

volumes:
  mariadb_data:
  mqtt_data:
  laravel_storage:
  backups:
